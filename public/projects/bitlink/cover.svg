<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <clipPath id="card-clip"><rect x="0" y="0" width="1600" height="1000" rx="0"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="#141210"/>

  <!-- subtle grid pattern -->
  <g stroke="#2a2622" stroke-width="1" opacity="0.5">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="1000"/>
    <line x1="640" y1="0" x2="640" y2="1000"/>
    <line x1="960" y1="0" x2="960" y2="1000"/>
    <line x1="1280" y1="0" x2="1280" y2="1000"/>
  </g>

  <!-- sidebar -->
  <rect x="80" y="120" width="240" height="760" rx="8" fill="#1e1c18" stroke="#3a3530" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="32" fill="#b5491e" opacity="0.9"/>
  <text x="200" y="208" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#f1ead9">B</text>
  <rect x="120" y="270" width="160" height="12" rx="3" fill="#3a3530"/>
  <rect x="120" y="310" width="120" height="8" rx="3" fill="#2a2622"/>

  <!-- sidebar nav items -->
  <g fill="#6b655a" font-family="monospace" font-size="14">
    <circle cx="130" cy="380" r="6" fill="#b5491e" opacity="0.6"/>
    <rect x="150" y="374" width="80" height="10" rx="2" fill="#4a4438"/>
    <circle cx="130" cy="420" r="6" fill="#3a3530"/>
    <rect x="150" y="414" width="100" height="10" rx="2" fill="#3a3530"/>
    <circle cx="130" cy="460" r="6" fill="#3a3530"/>
    <rect x="150" y="454" width="70" height="10" rx="2" fill="#3a3530"/>
    <circle cx="130" cy="500" r="6" fill="#3a3530"/>
    <rect x="150" y="494" width="90" height="10" rx="2" fill="#3a3530"/>
  </g>

  <!-- post 1 -->
  <rect x="400" y="120" width="720" height="260" rx="8" fill="#1e1c18" stroke="#3a3530" stroke-width="1.5"/>
  <circle cx="450" cy="170" r="22" fill="#b5491e" opacity="0.7"/>
  <rect x="485" y="158" width="120" height="12" rx="3" fill="#f1ead9" opacity="0.8"/>
  <rect x="485" y="178" width="80" height="8" rx="2" fill="#6b655a" opacity="0.5"/>
  <rect x="430" y="215" width="650" height="10" rx="2" fill="#4a4438"/>
  <rect x="430" y="235" width="580" height="10" rx="2" fill="#3a3530"/>
  <rect x="430" y="255" width="500" height="10" rx="2" fill="#3a3530"/>
  <!-- interaction bar -->
  <g opacity="0.6">
    <circle cx="450" cy="330" r="10" fill="none" stroke="#b5491e" stroke-width="2"/>
    <rect x="520" y="325" width="40" height="10" rx="2" fill="#3a3530"/>
    <circle cx="600" cy="330" r="10" fill="none" stroke="#6b655a" stroke-width="2"/>
    <rect x="670" y="325" width="40" height="10" rx="2" fill="#3a3530"/>
  </g>

  <!-- post 2 -->
  <rect x="400" y="410" width="720" height="230" rx="8" fill="#1e1c18" stroke="#3a3530" stroke-width="1.5"/>
  <circle cx="450" cy="460" r="22" fill="#6b655a" opacity="0.5"/>
  <rect x="485" y="448" width="100" height="12" rx="3" fill="#f1ead9" opacity="0.8"/>
  <rect x="485" y="468" width="70" height="8" rx="2" fill="#6b655a" opacity="0.5"/>
  <rect x="430" y="505" width="620" height="10" rx="2" fill="#4a4438"/>
  <rect x="430" y="525" width="540" height="10" rx="2" fill="#3a3530"/>
  <g opacity="0.6">
    <circle cx="450" cy="595" r="10" fill="#b5491e" opacity="0.8"/>
    <rect x="520" y="590" width="30" height="10" rx="2" fill="#3a3530"/>
    <circle cx="600" cy="595" r="10" fill="none" stroke="#6b655a" stroke-width="2"/>
    <rect x="670" y="590" width="45" height="10" rx="2" fill="#3a3530"/>
  </g>

  <!-- post 3 partial -->
  <rect x="400" y="670" width="720" height="210" rx="8" fill="#1e1c18" stroke="#3a3530" stroke-width="1.5"/>
  <circle cx="450" cy="720" r="22" fill="#4a4438"/>
  <rect x="485" y="708" width="140" height="12" rx="3" fill="#f1ead9" opacity="0.8"/>
  <rect x="485" y="728" width="90" height="8" rx="2" fill="#6b655a" opacity="0.5"/>
  <rect x="430" y="765" width="600" height="10" rx="2" fill="#4a4438"/>
  <rect x="430" y="785" width="480" height="10" rx="2" fill="#3a3530"/>

  <!-- chat panel (right side) -->
  <rect x="1200" y="120" width="320" height="760" rx="8" fill="#1e1c18" stroke="#3a3530" stroke-width="1.5"/>
  <rect x="1220" y="140" width="280" height="30" rx="4" fill="#2a2622"/>
  <text x="1240" y="161" font-family="monospace" font-size="13" fill="#6b655a">messages</text>

  <!-- chat items -->
  <g>
    <circle cx="1245" cy="210" r="14" fill="#b5491e" opacity="0.5"/>
    <rect x="1270" y="202" width="100" height="8" rx="2" fill="#4a4438"/>
    <rect x="1270" y="216" width="160" height="7" rx="2" fill="#3a3530"/>
  </g>
  <g>
    <circle cx="1245" cy="260" r="14" fill="#6b655a" opacity="0.4"/>
    <rect x="1270" y="252" width="80" height="8" rx="2" fill="#4a4438"/>
    <rect x="1270" y="266" width="140" height="7" rx="2" fill="#3a3530"/>
  </g>
  <g>
    <circle cx="1245" cy="310" r="14" fill="#4a4438"/>
    <rect x="1270" y="302" width="110" height="8" rx="2" fill="#4a4438"/>
    <rect x="1270" y="316" width="120" height="7" rx="2" fill="#3a3530"/>
  </g>

  <!-- chat bubbles at bottom -->
  <rect x="1230" y="620" width="200" height="40" rx="12" fill="#2a2622"/>
  <rect x="1245" y="633" width="140" height="8" rx="2" fill="#4a4438"/>
  <rect x="1310" y="680" width="180" height="40" rx="12" fill="#b5491e" opacity="0.25"/>
  <rect x="1325" y="693" width="120" height="8" rx="2" fill="#b5491e" opacity="0.5"/>
  <rect x="1230" y="740" width="160" height="40" rx="12" fill="#2a2622"/>
  <rect x="1245" y="753" width="100" height="8" rx="2" fill="#4a4438"/>

  <!-- input bar -->
  <rect x="1220" y="810" width="280" height="36" rx="6" fill="#2a2622" stroke="#3a3530" stroke-width="1"/>
  <rect x="1240" y="823" width="100" height="8" rx="2" fill="#3a3530"/>

  <!-- accent glow -->
  <circle cx="200" cy="200" r="120" fill="#b5491e" opacity="0.04"/>
</svg>
